services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fullcanchas
      MYSQL_USER: fullcanchas
      MYSQL_PASSWORD: fullcanchas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - fullcanchas_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufullcanchas", "-pfullcanchas"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://fullcanchas:fullcanchas@db:3306/fullcanchas
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-docker-secret-change-me-0123456789}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: demo
      SEED_DATABASE: "true"
    ports:
      - "3000:3000"

volumes:
  fullcanchas_mysql:
